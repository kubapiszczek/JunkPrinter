# This file is an example config file for cartesian style printers.
# One may copy and edit this file to configure a new cartesian
# printer.

# DO NOT COPY THIS FILE WITHOUT CAREFULLY READING AND UPDATING IT
# FIRST. Incorrectly configured parameters may cause damage.

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]
#[include adxl.cfg]

[stepper_x]
step_pin: gpio3
dir_pin: !gpio2
enable_pin: !gpio4
microsteps: 1
rotation_distance: 42.4
endstop_pin: gpio20
position_endstop: 0
position_max: 150
homing_speed: 50.0
second_homing_speed: 20.0

[stepper_y]
step_pin: gpio6
dir_pin: gpio5
enable_pin: !gpio7
microsteps: 1
rotation_distance: 42.4
endstop_pin: gpio21
position_endstop: 0
position_max: 160
homing_speed: 50.0
second_homing_speed: 20.0

[stepper_z]
step_pin: gpio9
dir_pin: gpio8
enable_pin: !gpio10
microsteps: 1
rotation_distance: 4.5
endstop_pin: gpio22
position_endstop: 30
position_max: 30
homing_positive_dir: true

[extruder]
step_pin: gpio12
dir_pin: !gpio11
enable_pin: !gpio13
microsteps: 16
rotation_distance: 33
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio14
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: gpio28
pullup_resistor: 1000
pressure_advance: 0.5
control = pid
pid_kp = 21.433
pid_ki = 0.649
pid_kd = 176.822
min_temp: 0
max_temp: 250
min_extrude_temp: 150

[fan]
pin: gpio15

#[heater_bed]
#heater_pin: gpio16
#sensor_type: EPCOS 100K B57560G104F
#sensor_pin: gpio27
#control: watermark
#min_temp: 0
#max_temp: 110

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E660D051135D2435-if00
#serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 300
max_z_velocity: 25
max_z_accel: 30

